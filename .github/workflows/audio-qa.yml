name: CHamorU learner flow, voice and phoneme QA
on:
  push:
    paths:
      - index.html
      - voice-studio.js
      - curriculum/drafts/orthography_foundations_v1.json
      - scripts/test_orthography_draft.mjs
      - scripts/test_voice_studio.js
      - scripts/test_family_words.js
      - scripts/test_media_library.js
      - scripts/test_phoneme_audio.js
      - .github/workflows/audio-qa.yml
  pull_request:
    paths:
      - index.html
      - voice-studio.js
      - curriculum/drafts/orthography_foundations_v1.json
      - scripts/test_orthography_draft.mjs
      - scripts/test_voice_studio.js
      - scripts/test_family_words.js
      - scripts/test_media_library.js
      - scripts/test_phoneme_audio.js
      - .github/workflows/audio-qa.yml
permissions:
  contents: read
jobs:
  phoneme-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test_phoneme_audio.js scripts/test_voice_studio.js scripts/test_family_words.js scripts/test_media_library.js
      - run: node scripts/test_orthography_draft.mjs
