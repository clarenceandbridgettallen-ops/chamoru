name: CHamorU phoneme audio regression
on:
  push:
    paths:
      - index.html
      - scripts/test_phoneme_audio.js
      - .github/workflows/audio-qa.yml
  pull_request:
    paths:
      - index.html
      - scripts/test_phoneme_audio.js
      - .github/workflows/audio-qa.yml
permissions:
  contents: read
jobs:
  phoneme-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test_phoneme_audio.js
